cy="652.891" rx="2.5" ry="2.5" fill="#000"/><text x="306.837" y="657.797" fill="#000" font-size="11" textLength="516.044" font-family="DejaVu Sans">Motion Plan is an optional value embedded in the job (versioned JSON), not a separate entity.</text><text x="294.837" y="670.601" fill="#000" font-size="11" textLength="686.71" font-family="DejaVu Sans">A job has exactly two input drawings, at most one result video and one frames archive; an asset belongs to at most one job.</text><text x="294.837" y="683.406" fill="#000" font-size="11" textLength="529.354" font-family="DejaVu Sans">Both drawings must belong to the job owner. Uploaded drawings may exist before the job does.</text><text x="294.837" y="696.211" fill="#000" font-size="11" textLength="437.196" font-family="DejaVu Sans">Logical and physical detail are shown together in physical-erd (see reports/05).</text></g><?plantuml-src TLHBRXf14DtFAIfu0zQ0JMHinrvOOCC2XIIAWrUMecQwcEcuftlI7mYn8-KGEKCEbfEaklbuaEpDQAXvzUfLlIhU29L9pn4wdQElrgqa7cKUEyANCYa4nJDXCec9VH2gOeQLO9Xwi5X1jtjSYohDCKHxnud4kGEdmOYySC25mSm9hH8dd4IuzWZ_Vl-1Qwqoh9nd4eQVRw0vyrOej1OM0fUjU_K5iq9fgVCL2CMnGdeebr8XuCmnSAiARP9GJBWLDAOMJGEOXIaS34z79yF-fII-YxUZyrwl3uy90BPB9YIzP0O3bs3IGhDWja3UIdxjg6v91UcDRBUliYsO53pWApH2yrh-1BbWqBSMNUIOmC5eD3gv6Qmv1cTdxxgZo66qn0kmZXcQas5BeV8KgD7TZtjbq7hfQ2WSTGfp6ZLQO2Ohn09JS8KlPshJbLQE9CJ1f635JtfoKQ8ApTYQlhuI9GkEm5ZFeiBngrsIDkTfIjyzUkHat5_861adPPWPWAu2KV1GvLBOWhooplYruRNFhAgCNX33HCVAdoHJS1WA8F8KuWwXGsEf9r5Iw_I2ncXJdokjc8Gx0ctTkQF9TeVdeyraJmSdfzVTg5iHNGgBDJQ59OPTj30dPZIL4Sg5shwgjA5mHMgkKc0aUu5NL3APmjDJkwqVQG4keA5f-spZEJWEGUjdfN3ry2HYbm4wMSUUrb1Xzqq6FNy1KZD-2z1xWFekl8pOtu-NCRkTYP_lrfytFUMeq327l97G6UT1KRnY6jRXddN4Gy-TlNGCTDPOpf1pCbaegeBmJS-WkV60ekFRZnzQuO0TCF8zUEueARhReGhzc43t2FY3h90hS4jDN9NV3OwsWZaejNL0bFi3OIGs1FTdS1bqid2BC4EfYIByDTL9g6YeFj2ks9M1qjjjGi1lko5pqNHWMadDGgFFUBOYrI8cpRN1NGRNQ0FzUvsBB1m2gQoAbOq_EBhW0oEyBOYRIkL8cIPCS8jge-7Gf3kXTkEw7XttMXsw2hvsw3y0?></g></svg>