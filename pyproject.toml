[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "language-guided-drawing-inbetweening"
version = "0.1.0.dev0"
description = "Research foundation for language-guided drawing animation inbetweening"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8,<9",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["language_guided_drawing_inbetweening*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100
# Doğrulama betikleri, diyagram araçları ve tasarım önizleme betikleri ürün kodu değildir; kanca açıkça verilen dosyalarda da atlasın diye force-exclude.
extend-exclude = ["docs/architecture/database-and-diagrams-v2", "docs/design"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
