name: Project task
description: Define a scoped research or engineering task.
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the problem and intended outcome without assuming research results.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define reviewable outputs and checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and open decisions
      description: Include data permissions, compute needs, and unresolved choices where relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Link approved documentation or run summaries; never attach private data or secrets.
